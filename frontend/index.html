<!doctype html>
<html lang="en">

    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      gtag('config', 'G-9Z7LRTHTP6');
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ikmangaman.lk</title>

    <!-- Immediate scroll-to-top in head to execute as early as possible -->
    <script>
      // Force scroll to top before anything else
      if (typeof window !== 'undefined') {
        window.scrollTo(0, 0);
        document.documentElement.scrollTop = 0;
        document.body.scrollTop = 0;
      }
    </script>

    <style>
      /* Ensure body starts at top and prevent scroll restoration */
      html, body {
        scroll-behavior: auto !important;
        overflow-anchor: none;
      }

      /* Force loading overlay to be visible regardless of scroll */
      .loading-overlay-force-visible {
        position: fixed !important;
        top: 0 !important;
        left: 0 !important;
        width: 100vw !important;
        height: 100vh !important;
        z-index: 999999 !important;
      }
    </style>
  </head>

  <body>
    <div id="root"></div>

    <!-- Disable browser scroll restoration and force top position -->
    <script>
      // Disable browser scroll restoration
      if ('scrollRestoration' in history) {
        history.scrollRestoration = 'manual';
      }

      // Multiple scroll-to-top attempts at different stages
      (function() {
        function forceScrollTop() {
          try {
            window.scrollTo(0, 0);
            document.documentElement.scrollTop = 0;
            document.body.scrollTop = 0;
          } catch (e) {}
        }

        // Immediate attempt
        forceScrollTop();

        // On DOM ready
        if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', forceScrollTop);
        } else {
          forceScrollTop();
        }

        // On window load
        window.addEventListener('load', forceScrollTop);

        // Backup interval for stubborn cases
        let attempts = 0;
        const interval = setInterval(() => {
          forceScrollTop();
          attempts++;
          if (attempts > 10) clearInterval(interval);
        }, 50);
      })();
    </script>

    <script type="module" src="/client/main.tsx"></script>
  </body>
</html>
